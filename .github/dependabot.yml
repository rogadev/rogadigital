version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    # Keep Dependabot behind pnpm's supply-chain policy. pnpm 11 enforces a
    # 24-hour minimumReleaseAge, so a PR raised for a version published hours
    # ago fails `pnpm install --frozen-lockfile` in CI with
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION and sits red until the window
    # lapses. These values all clear that 24-hour floor with margin, so the
    # PRs Dependabot opens are installable the moment they appear.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      svelte:
        patterns:
          - svelte
          - '@astrojs/svelte'
          - eslint-plugin-svelte
          - prettier-plugin-svelte
          - svelte-eslint-parser
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      lint-format:
        patterns:
          - eslint
          - eslint-*
          - '@typescript-eslint/*'
          - typescript-eslint
          - oxlint
          - prettier
          - prettier-*
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Vancouver
    open-pull-requests-limit: 3
    # github-actions supports default-days only — the semver-* keys are limited
    # to ecosystems with a semver contract.
    cooldown:
      default-days: 3
